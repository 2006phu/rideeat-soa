name: RideEat SOA - CI/CD & Auto Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: Static Analysis, OOP Architecture Verification & Unit Tests
  # ============================================================================
  python-oop-and-unit-tests:
    name: Backend OOP & Unit Tests (9 Microservices)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test & Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx fastapi pydantic pydantic-settings sqlalchemy aiosqlite greenlet

      - name: Lint Shared OOP Framework & 9 Microservices
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run OOP Core & 9-Service Architectural Verification Suite
        run: |
          python tests/test_oop_core.py -v

  # ============================================================================
  # JOB 2: Frontend React Super-App Build (Supports Ngrok Public API URL)
  # ============================================================================
  frontend-build:
    name: Web Admin React Build
    runs-on: ubuntu-latest
    needs: [python-oop-and-unit-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies & Build Production Bundle
        working-directory: ./web-admin
        env:
          # Connects deployed Frontend to your Ngrok HTTPS Gateway URL if configured in GitHub Variables/Secrets
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}
        run: |
          npm install
          npm run build

      - name: Upload Frontend Build Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-admin/dist

  # ============================================================================
  # JOB 3: Docker Compose Multi-Service Integration & Newman API Verification
  # ============================================================================
  integration-and-postman:
    name: Docker Compose & Postman API Verification
    runs-on: ubuntu-latest
    needs: [python-oop-and-unit-tests, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml Syntax
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate Postman v2.1 Collection Structure (All 9 Services)
        run: |
          node -e "const col = require('./postman/rideeat-collection.json'); if (!col.info || !col.item || col.item.length < 9) process.exit(1); console.log('Validated Postman folders:', col.item.length);"

  # ============================================================================
  # JOB 4: Automatic CD Deployment to GitHub Pages (on push to main)
  # ============================================================================
  deploy-frontend:
    name: Deploy Web Super-App to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend-build, integration-and-postman]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
