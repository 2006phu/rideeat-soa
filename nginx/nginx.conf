worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream timing for SOA observability
    log_format soa_gateway '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" upstream=$upstream_addr '
                           'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log soa_gateway;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Rate Limiting Zones (API Gateway Pattern: Throttling & DDoS Protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;

    # WebSocket Connection Upgrade Map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Microservice Definitions
    upstream auth_service {
        server auth-service:8001;
    }
    upstream user_service {
        server user-service:8002;
    }
    upstream ride_service {
        server ride-service:8003;
    }
    upstream food_service {
        server food-service:8004;
    }
    upstream map_service {
        server map-service:8005;
    }
    upstream payment_service {
        server payment-service:8006;
    }
    upstream rating_service {
        server rating-service:8007;
    }
    upstream promo_service {
        server promo-service:8008;
    }
    upstream notification_service {
        server notification-service:8009;
    }

    server {
        listen 8080;
        server_name localhost;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gateway-Source "RideEat-Nginx-Gateway";

        # Gateway Health Check Endpoint
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","gateway":"nginx-1.25","architecture":"RideEat-SOA","services":9}';
        }

        # 1. Auth Service (:8001)
        location /api/auth {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # 2. User Service (:8002)
        location /api/users {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://user_service;
        }

        # 3. Ride Service (:8003) + Live Ride WebSocket
        location /api/rides {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://ride_service;
        }
        location /ws/rides {
            proxy_pass http://ride_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # 4. Food Delivery Service (:8004) + Live Order WebSocket
        location /api/food {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://food_service;
        }
        location /ws/orders {
            proxy_pass http://food_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # 5. Map & Geo-Spatial Service (:8005)
        location /api/map {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://map_service;
        }

        # 6. Payment & E-Wallet Service (:8006)
        location /api/payments {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://payment_service;
        }

        # 7. Rating & Feedback Service (:8007)
        location /api/ratings {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://rating_service;
        }

        # 8. Promotion & Voucher Service (:8008)
        location /api/promos {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://promo_service;
        }

        # 9. Notification & Real-Time Push Service (:8009)
        location /api/notifications {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://notification_service;
        }
        location /ws/notifications {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
